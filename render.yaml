# Render Blueprint — one-click deploy for ReactiveSearch API.
#
# Pair with Aiven free OpenSearch: https://aiven.io/free-opensearch
# Set ES_CLUSTER_URL to your Aiven service URI (credentials in the URL).
#
# RS_SETUP_PROFILE (default: minimal) — change in the Render dashboard after deploy:
#   minimal  — essential plugins only; smallest shard footprint (free-tier prototyping)
#   standard — core search, analytics, and pipeline features
#   full     — all optional plugins and indices

services:
  - type: web
    name: reactivesearch-api
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /arc/health
    autoDeployTrigger: off
    envVars:
      - key: ES_CLUSTER_URL
        sync: false
      - key: RS_SETUP_PROFILE
        value: minimal
      - key: USERNAME
        sync: false
      - key: PASSWORD
        sync: false
      - key: PORT
        value: 8000
